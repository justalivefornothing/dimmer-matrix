<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dimmer Matrix — Lights Out</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Dimmer Matrix</h1>
    <p>Toggle cells. Each press flips itself and its neighbors. Solve with Gaussian elimination over GF(2).</p>
  </header>
  <div class="controls">
    <label>Size <input type="number" id="size" min="2" max="8" value="5" /></label>
    <button id="random">Random</button>
    <button id="solve">Solve</button>
    <button id="clear">Clear</button>
    <span id="status"></span>
  </div>
  <div id="board"></div>
  <script src="app.js"></script>
</body>
</html>
